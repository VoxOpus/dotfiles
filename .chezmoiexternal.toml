# ------------------------------------------------------------------------------
# .chezmoiexternal.toml - Standalone Zsh plugins managed declaratively
# Downloaded as tarballs (no .git bloat) into XDG_DATA_HOME and refreshed weekly.
# ------------------------------------------------------------------------------

[".local/share/zsh/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".local/share/zsh/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
